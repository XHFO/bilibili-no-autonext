<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>关闭自动连播</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>播完，就停下来</h1>
  <p>哔哩哔哩自动连播控制</p>
  <label><span>屏蔽自动连播</span><input id="enabled" type="checkbox" disabled></label>
  <p id="status" role="status">正在读取设置…</p>
  <small>可手动播放下一集或点击推荐视频。首次安装后，请刷新已打开的视频页面。</small>
  <script src="popup.js"></script>
</body>
</html>
